name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip source code
      run: unzip InvoiceArchiveAndroid_Source.zip
    
    - name: Generate Wrapper and Build
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug -Pkotlin.jvm.target.validation.mode=warning

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/*.apk'
